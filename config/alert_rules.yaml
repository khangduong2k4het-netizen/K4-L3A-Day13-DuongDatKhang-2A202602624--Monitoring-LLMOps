alerts:
  - name: request_latency_high
    severity: warning
    condition: latency_p95_ms > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: Duong Dat Khang
    runbook: docs/alerts.md#alert-1
  - name: request_error_rate_high
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: slack
    owner: Duong Dat Khang
    runbook: docs/alerts.md#alert-2
  - name: daily_cost_budget_exceeded
    severity: warning
    condition: daily_cost_usd > 2.5
    duration: 1m
    type: symptom-based
    channel: slack
    owner: Duong Dat Khang
    runbook: docs/alerts.md#alert-3
